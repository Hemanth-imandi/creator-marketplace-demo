<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creator Marketplace — Beta Demo</title>
<style>
:root{--ink:#172033;--muted:#687386;--line:#e1e7ef;--bg:#f4f7fb;--purple:#3268b2;--purple2:#eaf2fc;--green:#16835e;--orange:#d97706;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:17px;letter-spacing:-.5px}.mark{width:31px;height:31px;border-radius:9px;background:var(--purple);color:#fff;display:grid;place-items:center;font-weight:900}.topright{display:flex;align-items:center;gap:12px}.pill,.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;color:var(--ink)}.btn.primary{background:var(--purple);border-color:var(--purple);color:white;font-weight:700;box-shadow:0 2px 4px #1d4d8a18}.btn.ghost{background:var(--purple2);border-color:transparent;color:var(--purple)}.user{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:#e8e6ff;color:#4d42c5;font-weight:800}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1600px;margin:auto}.side{padding:24px 14px;border-right:1px solid var(--line);min-height:calc(100vh - 68px);background:#fff}.side-label{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:#9a9eac;font-weight:800;padding:14px 12px 8px}.nav{width:100%;text-align:left;border:0;background:transparent;color:#626779;padding:11px 12px;border-radius:9px;display:flex;gap:11px;align-items:center;margin:2px 0}.nav .ico{width:19px;text-align:center;font-size:16px}.nav.active{background:var(--purple2);color:var(--purple);font-weight:750;box-shadow:inset 3px 0 0 var(--purple)}.sidebottom{margin:34px 5px 0;padding:14px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}.main{padding:30px;max-width:1400px;width:100%;margin:0 auto}.crumb{font-size:12px;color:var(--muted);margin-bottom:9px}.heading{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:24px}.heading h1{font-size:28px;letter-spacing:-.9px;margin:0 0 5px;font-weight:760}.sub{color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.metric,.panel,.campaign,.profile,.empty{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px #17203305}.metric{padding:19px}.metric-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:27px;letter-spacing:-.8px;margin:12px 0 4px}.trend{font-size:11px;color:var(--green)}.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px}.panel{padding:21px;margin-bottom:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.panel h2{font-size:15px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.campaigns{display:grid;gap:10px}.campaign{padding:15px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:13px;align-items:center}.campaign-icon{height:44px;width:44px;border-radius:11px;background:#edf4fc;display:grid;place-items:center;font-size:20px}.campaign h3{margin:0 0 4px;font-size:14px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tag{font-size:11px;background:#f2f3f7;color:#5f6475;border-radius:6px;padding:4px 7px}.tag.green{background:#e4f7ef;color:#14724f}.tag.purple{background:var(--purple2);color:var(--purple)}.right{text-align:right}.money{font-weight:800;font-size:16px}.bar{height:7px;background:#f0f1f6;border-radius:20px;overflow:hidden;margin:12px 0 6px}.bar span{height:100%;display:block;background:var(--purple);border-radius:20px}.rowline{display:flex;justify-content:space-between;gap:12px;margin:13px 0}.activity{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #f0f1f5}.activity:last-child{border:0}.dot{width:8px;height:8px;border-radius:50%;background:var(--purple);margin-top:6px;flex-shrink:0}.avatar{width:38px;height:38px;border-radius:11px;background:#e8f0fb;display:grid;place-items:center;font-weight:800;color:#285b9b}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:17px}.filters input,.filters select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 12px;color:var(--ink);outline:none}.filters input{min-width:210px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.profile{padding:17px}.profiletop{display:flex;gap:11px;align-items:center}.profile .avatar{width:48px;height:48px;border-radius:50%}.profile h3{margin:0;font-size:14px}.profile .sub{font-size:12px}.profilemetrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.profilemetrics div{background:#f8f8fb;border-radius:9px;padding:10px}.profilemetrics strong{display:block;font-size:16px}.profilemetrics span{font-size:11px;color:var(--muted)}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#9296a5;padding:12px 10px;border-bottom:1px solid var(--line)}.table td{padding:14px 10px;border-bottom:1px solid #f0f1f5}.table tr:last-child td{border:0}.status{display:inline-block;padding:5px 8px;border-radius:7px;background:#fff3db;color:#9a6100;font-size:11px;font-weight:700}.status.live{background:#e3f8ee;color:#16734f}.status.review{background:#eeeaff;color:#5c4ad5}.chart{height:180px;display:flex;align-items:end;gap:12px;padding:15px 4px 0;border-bottom:1px solid var(--line)}.chartcol{flex:1;display:flex;align-items:center;justify-content:end;flex-direction:column;gap:7px;height:100%;color:var(--muted);font-size:10px}.chartbar{width:100%;max-width:38px;background:#d5e3f5;border-radius:6px 6px 0 0;min-height:10px}.chartbar.dark{background:var(--purple)}.notice{padding:13px 15px;background:#eef5fd;border:1px solid #d8e7f8;border-radius:10px;color:#315b8a;margin-bottom:18px;font-size:12px}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#15182766;display:grid;place-items:center;z-index:50;padding:20px}.modal{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 25px 80px #0002}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal h2{margin:0;font-size:20px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;color:#626779;font-weight:700}.field textarea{min-height:80px;resize:vertical}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;bottom:22px;right:22px;background:#202338;color:#fff;padding:13px 17px;border-radius:11px;z-index:80;box-shadow:0 10px 30px #0002}.footnote{text-align:center;color:#9a9eac;font-size:11px;padding:20px}@media(max-width:1000px){.layout{grid-template-columns:190px minmax(0,1fr)}.main{padding:22px}.metrics{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.top{padding:0 14px}.topright .pill{display:none}.layout{display:block}.side{min-height:0;display:flex;gap:4px;overflow:auto;padding:9px;border-right:0;border-bottom:1px solid var(--line)}.side-label,.sidebottom{display:none}.nav{white-space:nowrap;width:auto;padding:9px 11px}.main{padding:18px 13px}.heading{display:block}.heading .btn{margin-top:13px}.metrics{gap:9px}.metric{padding:13px}.metric strong{font-size:22px}.grid2{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.campaign{grid-template-columns:38px minmax(0,1fr)}.campaign .right{grid-column:2;text-align:left}.tablewrap{overflow:auto}.table{min-width:600px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark">S</div><span>Shiftly <span style="font-weight:500;color:#8b8fa0">beta</span></span></div><div class="topright"><select class="pill" id="market" aria-label="Market"><option value="Global">🌐 Global market</option><option value="United States">🇺🇸 United States</option><option value="United Kingdom">🇬🇧 United Kingdom</option><option value="France">🇫🇷 France</option><option value="India">🇮🇳 India</option><option value="Netherlands">🇳🇱 Netherlands</option></select><select class="pill" id="role" aria-label="Demo role"><option value="brand">Brand view</option><option value="creator">Creator view</option><option value="admin">Admin view</option></select><button class="btn" id="helpBtn">Help</button><div class="user">JD</div></div></header>
<div class="layout"><aside class="side" id="sidebar"></aside><main class="main" id="main"></main></div>
<div class="footnote">Interactive concept demo · Sample data only · Not affiliated with SideShift</div>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const icons={Overview:"⌂",Campaigns:"▤",Creators:"♙",Applications:"⇥",Content:"▣",Analytics:"▥",Payments:"＄",Messages:"✉",Settings:"⚙",Users:"♧",Reports:"▤",Support:"?",Help:"?"};
const state={role:"brand",page:"Overview",market:"Global",search:"",filter:"All",campaigns:[
{id:1,title:"Summer Travel Reels",brand:"Wanderly",category:"Travel",platform:"Instagram Reels",market:"France",budget:2400,applicants:38,creators:12,status:"Live",views:"182K",icon:"✈️"},
{id:2,title:"Everyday Skincare Stories",brand:"Glow Lab",category:"Beauty",platform:"TikTok",market:"United States",budget:3200,applicants:54,creators:18,status:"Live",views:"264K",icon:"✦"},
{id:3,title:"Gaming Setup Challenge",brand:"Nexus Gear",category:"Gaming",platform:"YouTube Shorts",market:"Global",budget:1500,applicants:21,creators:8,status:"Review",views:"76K",icon:"🎮"},
{id:4,title:"Coffee Shop Diaries",brand:"Daily Ritual",category:"Lifestyle",platform:"TikTok",market:"United Kingdom",budget:900,applicants:17,creators:6,status:"Draft",views:"—",icon:"☕"}
], applications:[
{name:"Maya Chen",handle:"@mayamakes",niche:"Travel & lifestyle",followers:"84.2K",market:"France",status:"New"},
{name:"Alex Rivera",handle:"@alexcreates",niche:"Gaming",followers:"126K",market:"United States",status:"Review"},
{name:"Priya Shah",handle:"@priyashorts",niche:"Beauty",followers:"52.7K",market:"India",status:"New"},
{name:"Leo Martin",handle:"@leomotion",niche:"Travel",followers:"31.4K",market:"United Kingdom",status:"Invited"}
],activities:[
["New creator application","Maya Chen applied to Summer Travel Reels","8 min ago"],
["Content approved","Glow Lab · Video #GL-204","42 min ago"],
["Milestone reached","Summer Travel Reels passed 100K views","2 hours ago"],
["Payment processed","$240 sent to creator","Yesterday"]
]};
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:state.market==='India'?'INR':state.market==='France'||state.market==='Netherlands'?'EUR':'USD',maximumFractionDigits:0}).format(n)}
function navItems(){if(state.role==='creator')return ['Overview','Campaigns','Applications','Content','Analytics','Payments','Messages','Settings'];if(state.role==='admin')return ['Overview','Campaigns','Creators','Users','Reports','Payments','Support','Settings'];return ['Overview','Campaigns','Creators','Applications','Content','Analytics','Payments','Messages','Settings']}
function renderSidebar(){let items=navItems();document.getElementById('sidebar').innerHTML=`<div class="side-label">Workspace</div>${items.map(x=>`<button class="nav ${state.page===x?'active':''}" onclick="go('${x}')"><span class="ico">${icons[x]||'•'}</span>${x}</button>`).join('')}<div class="sidebottom"><strong>Need a hand?</strong><p>Visit the help centre or contact our support team.</p><button class="btn" style="width:100%" onclick="go('Support')">Contact support</button></div>`}
function heading(title,sub,action=''){return `<div class="crumb">Workspace / ${title}</div><div class="heading"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${action}</div>`}
function metric(label,value,foot,icon){return `<div class="metric"><div class="metric-top"><span>${label}</span><span>${icon}</span></div><strong>${value}</strong><div class="trend">${foot}</div></div>`}
function campaignCard(c){return `<div class="campaign"><div class="campaign-icon">${c.icon}</div><div><h3>${c.title}</h3><div class="muted small">${c.brand} · ${c.platform}</div><div class="tags"><span class="tag">${c.category}</span><span class="tag">🌐 ${c.market}</span><span class="tag ${c.status==='Live'?'green':c.status==='Review'?'purple':''}">${c.status}</span></div></div><div class="right"><div class="money">${money(c.budget)}</div><div class="muted small">Campaign budget</div><button class="btn" style="margin-top:8px" onclick="openCampaign(${c.id})">View details</button></div></div>`}
function activities(){return state.activities.map(a=>`<div class="activity"><div class="dot"></div><div style="flex:1"><strong>${a[0]}</strong><div class="muted small">${a[1]}</div></div><div class="muted small">${a[2]}</div></div>`).join('')}
function dashboard(){let creator=state.role==='creator',admin=state.role==='admin';return heading(creator?'Creator overview':admin?'Platform overview':'Welcome back, Jordan','Here’s what’s happening in your creator workspace today.',`<button class="btn primary" onclick="${creator?'go(\'Campaigns\')':'openNewCampaign()'}">${creator?'Explore campaigns':admin?'＋ Add campaign':'＋ Create campaign'}</button>`)+`<div class="notice">You’re viewing a working UI concept. Actions update this demo locally; no real accounts, contracts or payments are connected.</div><div class="metrics">${metric(creator?'Your earnings':admin?'Platform volume':'Total creator spend',creator?money(1860):money(24850),'+12.8% vs last month','↗')}${metric(creator?'Published posts':'Active campaigns',creator?'14':admin?'128':'8','Across selected market','▤')}${metric(creator?'Tracked views':'Creator applications',creator?'482K':admin?'2,418':'346','+18.4% this month','◉')}${metric(creator?'Pending payout':'Content awaiting review',creator?money(420):admin?'23':'12','Needs attention','◷')}</div><div class="grid2"><section class="panel"><div class="panelhead"><h2>${creator?'Recommended campaigns':admin?'Recent campaigns':'Your campaigns'}</h2><button class="btn" onclick="go('Campaigns')">View all →</button></div><div class="campaigns">${state.campaigns.slice(0,3).map(campaignCard).join('')}</div></section><section><div class="panel"><div class="panelhead"><h2>Performance snapshot</h2><span class="muted small">Last 7 days</span></div><div style="font-size:25px;font-weight:800">1.28M <span class="trend" style="font-size:12px">↗ 16.2%</span></div><div class="muted small">Tracked views across active campaigns</div><div class="chart">${[38,55,43,72,62,87,100].map((h,i)=>`<div class="chartcol"><div class="chartbar ${i===6?'dark':''}" style="height:${h}%"></div>${['M','T','W','T','F','S','S'][i]}</div>`).join('')}</div></div><div class="panel"><div class="panelhead"><h2>Recent activity</h2><button class="btn" onclick="go('Messages')">Open inbox</button></div>${activities()}</div></section></div>`}
function campaignsPage(){let list=state.campaigns.filter(c=>(state.market==='Global'||c.market===state.market||c.market==='Global')&&(c.title+' '+c.brand+' '+c.category).toLowerCase().includes(state.search.toLowerCase())&&(state.filter==='All'||c.status===state.filter));return heading('Campaigns','Discover opportunities, manage briefs and track campaign progress.',`<button class="btn primary" onclick="${state.role==='creator'?'toast(\'You are viewing campaign discovery.\')':'openNewCampaign()'}">${state.role==='creator'?'＋ Save search':'＋ Create campaign'}</button>`)+`<div class="filters"><input placeholder="Search campaigns..." value="${state.search}" oninput="state.search=this.value;render()"><select onchange="state.filter=this.value;render()">${['All','Live','Review','Draft'].map(x=>`<option ${state.filter===x?'selected':''}>${x}</option>`).join('')}</select><select onchange="state.category=this.value;render()"><option>All categories</option><option>Travel</option><option>Beauty</option><option>Gaming</option></select><span class="muted small" style="align-self:center">${list.length} campaigns in ${state.market}</span></div><div class="campaigns">${list.length?list.map(campaignCard).join(''):'<div class="empty" style="padding:35px;text-align:center">No campaigns match these filters. Try another market or search.</div>'}</div>`}
function creatorsPage(){let names=[['MC','Maya Chen','@mayamakes','Travel & lifestyle','84.2K','France'],['AR','Alex Rivera','@alexcreates','Gaming','126K','United States'],['PS','Priya Shah','@priyashorts','Beauty','52.7K','India'],['LM','Leo Martin','@leomotion','Travel','31.4K','United Kingdom'],['SK','Sam Kim','@samframes','Lifestyle','97.1K','United States'],['EB','Emma Brooks','@emmab','Beauty','42.8K','France']].filter(x=>state.market==='Global'||x[5]===state.market);return heading('Creator discovery','Find creators by niche, audience, location and platform.')+`<div class="filters"><input placeholder="Search name or niche..." oninput="state.search=this.value;render()"><select><option>All niches</option><option>Travel</option><option>Beauty</option><option>Gaming</option></select><select><option>All platforms</option><option>TikTok</option><option>Instagram</option><option>YouTube</option></select></div><div class="cards">${names.filter(x=>(x[1]+x[3]).toLowerCase().includes(state.search.toLowerCase())).map(x=>`<div class="profile"><div class="profiletop"><div class="avatar">${x[0]}</div><div><h3>${x[1]}</h3><div class="sub">${x[2]}</div></div></div><div class="tags"><span class="tag">${x[3]}</span><span class="tag">🌐 ${x[5]}</span><span class="tag green">Verified</span></div><div class="profilemetrics"><div><strong>${x[4]}</strong><span>Followers</span></div><div><strong>4.8/5</strong><span>Creator score</span></div></div><button class="btn" style="width:100%" onclick="toast('Demo: profile opened for ${x[1]}')">View profile</button></div>`).join('')}</div>`}
function applicationsPage(){return heading('Applications','Review creator applications and move the best matches forward.')+`<section class="panel"><div class="panelhead"><h2>Latest applications</h2><span class="tag purple">${state.applications.length} new & in review</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Creator</th><th>Niche</th><th>Audience</th><th>Market</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.applications.filter(a=>state.market==='Global'||a.market===state.market).map((a,i)=>`<tr><td><strong>${a.name}</strong><div class="muted small">${a.handle}</div></td><td>${a.niche}</td><td>${a.followers}</td><td>${a.market}</td><td><span class="status ${a.status==='Invited'?'live':a.status==='Review'?'review':''}">${a.status}</span></td><td><button class="btn" onclick="reviewApp(${i})">Review</button></td></tr>`).join('')}</tbody></table></div></section>`}
function contentPage(){return heading('Content review','Review submissions, request changes and approve creator content.')+`<div class="metrics">${metric('Awaiting review','12','5 due today','◷')}${metric('Approved this week','38','+9 this week','✓')}${metric('Changes requested','4','Waiting on creator','↻')}${metric('Published','126','Across all campaigns','▣')}</div><section class="panel"><div class="panelhead"><h2>Submissions queue</h2><select><option>All statuses</option><option>Awaiting review</option><option>Approved</option></select></div><div class="tablewrap"><table class="table"><thead><tr><th>Submission</th><th>Campaign</th><th>Submitted</th><th>Status</th><th>Action</th></tr></thead><tbody>${[['Summer city guide','Summer Travel Reels','18 min ago','Awaiting review'],['3-step routine','Everyday Skincare Stories','1 hour ago','Awaiting review'],['Desk setup tour','Gaming Setup Challenge','Yesterday','Approved']].map((r,i)=>`<tr><td><strong>${r[0]}</strong><div class="muted small">Video · ${['0:28','0:34','0:41'][i]}</div></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="status ${r[3]==='Approved'?'live':'review'}">${r[3]}</span></td><td><button class="btn" onclick="reviewContent('${r[0]}')">Review</button></td></tr>`).join('')}</tbody></table></div></section>`}
function analyticsPage(){return heading('Analytics','Understand creator performance, content reach and campaign efficiency.')+`<div class="metrics">${metric('Total views','1.28M','↗ 16.2%','◉')}${metric('Engagement rate','6.8%','↗ 0.7 pts','♡')}${metric('Average CPM',money(8.42),'↘ 4.3%','＄')}${metric('Published posts','126','↗ 22 this month','▣')}</div><div class="grid2"><section class="panel"><div class="panelhead"><h2>Views over time</h2><select><option>Last 7 days</option><option>Last 30 days</option></select></div><div class="chart">${[26,43,39,65,55,78,94,68,100,85,73,92].map((h,i)=>`<div class="chartcol"><div class="chartbar ${i===8?'dark':''}" style="height:${h}%"></div>${i+1}</div>`).join('')}</div></section><section class="panel"><div class="panelhead"><h2>Top campaigns</h2></div>${state.campaigns.slice(0,3).map((c,i)=>`<div class="rowline"><div><strong>${c.title}</strong><div class="muted small">${c.creators} creators · ${c.views} views</div></div><strong>${[42,31,18][i]}%</strong></div><div class="bar"><span style="width:${[82,63,36][i]}%"></span></div>`).join('')}</section></div>`}
function paymentsPage(){return heading('Payments','Track creator balances, campaign budgets and payment history.')+`<div class="metrics">${metric('Available balance',money(8420),'Ready to allocate','＄')}${metric('Pending approval',money(1260),'3 deliverables','◷')}${metric('Paid this month',money(12840),'+8.5%','✓')}${metric('Processing fees',money(384),'Illustrative only','↗')}</div><section class="panel"><div class="panelhead"><h2>Recent transactions</h2><button class="btn" onclick="toast('Demo export prepared')">Export CSV</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Transaction</th><th>Campaign</th><th>Date</th><th>Status</th><th>Amount</th></tr></thead><tbody>${[['Creator payout · Maya Chen','Summer Travel Reels','Today','Processing',240],['Creator payout · Priya Shah','Everyday Skincare Stories','Yesterday','Paid',180],['Campaign funding','Gaming Setup Challenge','Oct 6','Paid',1500],['Creator bonus · Leo Martin','Summer Travel Reels','Oct 4','Paid',95]].map(r=>`<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="status ${r[3]==='Paid'?'live':''}">${r[3]}</span></td><td><strong>${money(r[4])}</strong></td></tr>`).join('')}</tbody></table></div></section>`}
function messagesPage(){return heading('Messages','Keep campaign conversations and approvals in one place.')+`<div class="grid2"><section class="panel"><div class="panelhead"><h2>Inbox</h2><span class="tag purple">3 unread</span></div>${[['MC','Maya Chen','Summer Travel Reels','I can upload the revised cut this afternoon.','9:42 AM'],['AR','Alex Rivera','Gaming Setup Challenge','Thanks for the brief — quick question about the hook.','Yesterday'],['PS','Priya Shah','Everyday Skincare Stories','The first version is ready for review.','Yesterday']].map(x=>`<div class="activity"><div class="avatar">${x[0]}</div><div style="flex:1"><strong>${x[1]}</strong><div class="muted small">${x[2]}</div><div style="margin-top:6px">${x[3]}</div></div><span class="muted small">${x[4]}</span></div>`).join('')}</section><section class="panel"><h2>Send a message</h2><div class="field"><label>To</label><select><option>Maya Chen — Summer Travel Reels</option><option>Alex Rivera — Gaming Setup Challenge</option><option>Priya Shah — Skincare Stories</option></select></div><div class="field"><label>Message</label><textarea id="messageText" placeholder="Write your message..."></textarea></div><button class="btn primary" onclick="sendMessage()">Send message</button></section></div>`}
function settingsPage(){return heading('Workspace settings','Manage workspace details, market preferences and notifications.')+`<div class="grid2"><section class="panel"><h2>Workspace profile</h2><div class="field"><label>Workspace name</label><input value="${state.role==='creator'?'Jordan Creator Studio':state.role==='admin'?'Shiftly Operations':'Northstar Brands'}"></div><div class="field"><label>Default market</label><select onchange="state.market=this.value;document.getElementById('market').value=this.value">${['Global','United States','United Kingdom','France','India','Netherlands'].map(m=>`<option ${state.market===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label>Preferred language</label><select><option>English</option><option>French</option><option>Hindi</option><option>Dutch</option></select></div><button class="btn primary" onclick="toast('Settings saved in this demo')">Save changes</button></section><section class="panel"><h2>Notifications</h2>${['New creator applications','Content submitted for review','Payment status changes','Weekly performance summary'].map(x=>`<div class="rowline"><span>${x}</span><input type="checkbox" checked></div>`).join('')}</section></div>`}
function supportPage(){return heading('Help & support','Get help with campaigns, account access, content rights or payments.')+`<div class="grid2"><section class="panel"><h2>Contact support</h2><p class="muted">Tell us what happened and our demo support workflow will create a ticket.</p><div class="field"><label>Topic</label><select id="supportTopic"><option>Campaign or creator</option><option>Payment or payout</option><option>Content rights</option><option>Account access</option><option>Report a problem</option></select></div><div class="field"><label>Subject</label><input id="supportSubject" placeholder="A short summary"></div><div class="field"><label>Details</label><textarea id="supportDetails" placeholder="Describe the issue..."></textarea></div><button class="btn primary" onclick="submitSupport()">Submit ticket</button></section><section class="panel"><h2>Help centre</h2>${[['Getting started','Create your first campaign'],['Creator applications','Review and shortlist applicants'],['Content review','Approve, reject or request changes'],['Payments','Understand balances and payout status'],['Market eligibility','Country rules and creator availability']].map(x=>`<div class="activity"><div class="dot"></div><div><strong>${x[0]}</strong><div class="muted small">${x[1]}</div></div></div>`).join('')}</section></div><section class="panel"><h2>Your support tickets</h2><p class="muted small" id="ticketList">No demo tickets created in this session.</p></section>`}
function reportsPage(){return heading('Reports & moderation','Review flagged activity, account integrity and platform health.')+`<div class="metrics">${metric('Open reports','7','2 high priority','⚑')}${metric('Accounts under review','3','Manual checks required','♙')}${metric('Disputes','2','Awaiting response','◷')}${metric('Resolved this week','19','Within target','✓')}</div><section class="panel"><h2>Queue</h2><div class="tablewrap"><table class="table"><thead><tr><th>Report</th><th>Type</th><th>Priority</th><th>Status</th><th>Action</th></tr></thead><tbody>${[['Potential fake views','Engagement integrity','High','Open'],['Usage-rights disagreement','Content rights','Medium','Review'],['Creator profile verification','Identity','Low','Open']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="status ${r[2]==='High'?'':'review'}">${r[3]}</span></td><td><button class="btn" onclick="toast('Demo moderation case opened')">Review</button></td></tr>`).join('')}</tbody></table></div></section>`}
function genericPage(){return heading(state.page,'Manage your workspace and keep work moving.')+`<div class="panel"><div class="panelhead"><h2>${state.page}</h2><button class="btn primary" onclick="toast('Action completed in demo')">＋ New</button></div><p class="muted">This section is a clickable placeholder for the beta prototype. Use the navigation to explore campaigns, creator discovery, applications, content review, analytics, payments and support.</p></div>`}
function render(){renderSidebar();let html='';switch(state.page){case'Overview':html=dashboard();break;case'Campaigns':html=campaignsPage();break;case'Creators':html=creatorsPage();break;case'Applications':html=applicationsPage();break;case'Content':html=contentPage();break;case'Analytics':html=analyticsPage();break;case'Payments':html=paymentsPage();break;case'Messages':html=messagesPage();break;case'Settings':html=settingsPage();break;case'Support':html=supportPage();break;case'Reports':case'Users':html=reportsPage();break;default:html=genericPage()}document.getElementById('main').innerHTML=html}
function go(p){state.page=p;state.search='';render()}
function toast(msg){document.getElementById('toastRoot').innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>document.getElementById('toastRoot').innerHTML='',2800)}
function openNewCampaign(){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>Create a campaign</h2><button class="btn" onclick="closeModal()">✕</button></div><div class="field"><label>Campaign title</label><input id="newTitle" placeholder="e.g. Autumn product stories"></div><div class="field"><label>Category</label><select id="newCategory"><option>Travel</option><option>Beauty</option><option>Gaming</option><option>Lifestyle</option><option>Technology</option></select></div><div class="field"><label>Target market</label><select id="newMarket">${['Global','United States','United Kingdom','France','India','Netherlands'].map(m=>`<option ${m===state.market?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label>Budget</label><input id="newBudget" type="number" min="100" placeholder="1500"></div><div class="field"><label>Brief</label><textarea id="newBrief" placeholder="Describe the content, deliverables and success criteria"></textarea></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCampaign()">Create campaign</button></div></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function saveCampaign(){let title=document.getElementById('newTitle').value.trim();if(!title){toast('Add a campaign title first');return}let category=document.getElementById('newCategory').value;state.campaigns.unshift({id:Date.now(),title,brand:'Northstar Brands',category,platform:'TikTok',market:document.getElementById('newMarket').value,budget:Number(document.getElementById('newBudget').value)||1000,applicants:0,creators:0,status:'Draft',views:'—',icon:category==='Travel'?'✈️':category==='Gaming'?'🎮':category==='Beauty'?'✦':'▣'});closeModal();state.page='Campaigns';render();toast('Campaign created in demo')}
function openCampaign(id){let c=state.campaigns.find(x=>x.id===id);document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${c.title}</h2><button class="btn" onclick="closeModal()">✕</button></div><div class="tags"><span class="tag purple">${c.status}</span><span class="tag">${c.category}</span><span class="tag">🌐 ${c.market}</span></div><div class="metrics" style="grid-template-columns:repeat(2,1fr);margin-top:16px">${metric('Budget',money(c.budget),'Creator spend','＄')}${metric('Applicants',c.applicants,'Interested creators','♙')}</div><p class="muted">Demo brief: create native-feeling short-form content aligned with the campaign goals. Confirm deliverables, usage rights and payment terms before production.</p><div class="modalfoot"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();toast('Campaign saved to your workspace')">Save campaign</button></div></div></div>`}
function reviewApp(i){let a=state.applications[i];document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>Review ${a.name}</h2><button class="btn" onclick="closeModal()">✕</button></div><p><strong>${a.handle}</strong> · ${a.niche} · ${a.followers} followers</p><p class="muted">Market: ${a.market}. Review audience fit, content quality, audience authenticity and campaign availability.</p><div class="modalfoot"><button class="btn" onclick="updateApp(${i},'Declined')">Decline</button><button class="btn" onclick="updateApp(${i},'Review')">Keep in review</button><button class="btn primary" onclick="updateApp(${i},'Shortlisted')">Shortlist creator</button></div></div></div>`}
function updateApp(i,s){state.applications[i].status=s;closeModal();render();toast('Application updated: '+s)}
function reviewContent(name){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>Review submission</h2><button class="btn" onclick="closeModal()">✕</button></div><p><strong>${name}</strong></p><div style="height:145px;background:#f0eff8;border-radius:12px;display:grid;place-items:center;font-size:40px;color:#756be2">▶</div><div class="field"><label>Feedback for creator</label><textarea id="feedback" placeholder="Optional feedback or revision notes"></textarea></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn" onclick="closeModal();toast('Revision requested in demo')">Request changes</button><button class="btn primary" onclick="closeModal();toast('Content approved in demo')">Approve content</button></div></div></div>`}
function sendMessage(){let t=document.getElementById('messageText').value.trim();if(!t){toast('Write a message first');return}state.activities.unshift(['Message sent','Your demo message has been added to the workspace','Just now']);toast('Message sent in demo');render()}
function submitSupport(){let s=document.getElementById('supportSubject').value.trim(),d=document.getElementById('supportDetails').value.trim();if(!s||!d){toast('Add a subject and details');return}let ticket='SUP-'+Math.floor(1000+Math.random()*9000);let list=document.getElementById('ticketList');list.innerHTML=`<strong>${ticket}</strong> · ${s} · <span class="status review">Open</span>`;toast('Support ticket created: '+ticket)}
document.getElementById('role').addEventListener('change',e=>{state.role=e.target.value;state.page='Overview';render()});document.getElementById('market').addEventListener('change',e=>{state.market=e.target.value;render();toast('Market preview: '+state.market)});document.getElementById('helpBtn').addEventListener('click',()=>go('Support'));render();
</script>
</body></html>
